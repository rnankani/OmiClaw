<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ClassFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Main App Wrapper -->
  <div class="app-wrapper">
    <!-- Sticky Header -->
    <header class="app-header">
    <div class="header-left">
      <h1>ClassFlow</h1>
    </div>
    <div class="header-right">
      <button id="theme-toggle" class="icon-button theme-btn" aria-label="Toggle Theme">
        <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      </button>
      <div class="status-indicator">
        <span class="status-dot disconnected" id="header-status-dot"></span>
        <span class="status-text" id="status">Connecting...</span>
      </div>
    </div>
  </header>

  <!-- Main Scrollable Feed Area -->
  <main class="feed-area" id="feed-area">
    <div class="messages" id="messages">
      <!-- AI & User messages go here -->
    </div>
  </main>

  <!-- Reasoning Drawer (Progressive Disclosure) -->
  <div class="reasoning-drawer-wrapper">
    <button class="reasoning-toggle" id="reasoning-toggle">
      <svg id="chevron-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="toggle-icon"><polyline points="6 9 12 15 18 9"></polyline></svg>
      <span>View Reasoning</span>
    </button>
    
    <div class="reasoning-drawer" id="reasoning-drawer">
      <div class="drawer-content">
        <!-- Camera Feed -->
        <div class="panel" id="panel-camera">
          <div class="panel-header">Camera Feed</div>
          <div class="panel-body" id="camera-body">
            <div class="placeholder" id="camera-placeholder">Waiting for Omi glasses photo...</div>
            <img id="camera-img" class="hidden" alt="Latest photo from Omi glasses">
          </div>
        </div>

        <!-- Parsed Details -->
        <div class="panel" id="panel-parsed">
          <div class="panel-header">Parsed Details</div>
          <div class="panel-body" id="parsed-body">
            <div class="detail-grid" id="parsed-grid">
              <div class="placeholder" style="grid-column: 1/-1;">Awaiting context...</div>
            </div>
          </div>
        </div>

        <!-- System Status -->
        <div class="panel" id="panel-status">
          <div class="panel-header">System Status</div>
          <div class="panel-body" id="status-body">
            <div class="status-items" id="status-items">
              <div class="status-row">
                <span class="status-dot active" id="dot-gateway"></span>
                <span>OpenClaw Gateway</span>
              </div>
              <div class="status-row">
                <span class="status-dot off" id="dot-omi"></span>
                <span>Omi Glasses</span>
              </div>
              <div class="status-row">
                <span class="status-dot off" id="dot-call"></span>
                <span id="call-status-text">Phone Call: Idle</span>
              </div>
            </div>
            <div class="call-result" id="call-result"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Fixed Input Bar (Voice Only) -->
  <div class="input-bar" id="input-bar">
    <div class="input-container voice-only">
      <button class="icon-button voice-btn" aria-label="Voice Input">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2A3 3 0 0 0 9 5v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
      </button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
